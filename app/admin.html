<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PLAYBITS &mdash; Admin Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#000;--bg2:#020208;--bg3:#060612;--card:rgba(4,4,16,.95);--card-border:rgba(0,200,255,.18);--card-glow:rgba(0,200,255,.12);--text:#fff;--text2:#9696b6;--text3:#52527a;--cyan:#00e5ff;--purple:#a855f7;--gold:#ffd700;--pink:#ff2d95;--green:#00ff88;--red:#ff3355;--orange:#ff8c00;--r:14px;--rs:8px;--transition:.4s cubic-bezier(.4,0,.2,1)}
body{background:var(--bg);color:var(--text);font-family:'Rajdhani',sans-serif;min-height:100vh;overflow-x:hidden;display:flex}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at center,transparent 55%,var(--vt));pointer-events:none;z-index:0}
::-webkit-scrollbar{width:0}

/* LOGIN */
#loginScreen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:9999;flex-direction:column;gap:16px;padding:20px}
.login-box{width:100%;max-width:380px;background:var(--card);border:2px solid var(--card-border);border-radius:var(--r);padding:32px 24px;text-align:center}
.login-box .lb-logo{font:900 28px 'Orbitron',sans-serif;margin-bottom:4px}
.login-box .lb-logo .play{color:var(--text)}
.login-box .lb-logo .bits{color:var(--pink)}
.login-box .lb-sub{font-size:12px;color:var(--text3);letter-spacing:3px;text-transform:uppercase;margin-bottom:24px}
.login-box input{width:100%;padding:14px 16px;border-radius:var(--rs);border:1px solid var(--card-border);background:rgba(0,0,0,.3);color:var(--text);font:500 15px 'Rajdhani',sans-serif;outline:none;margin-bottom:12px;transition:border .3s}
.login-box input:focus{border-color:var(--cyan)}
.login-box .login-btn{width:100%;padding:14px;border-radius:var(--rs);border:none;background:linear-gradient(135deg,var(--cyan),var(--purple));color:#fff;font:700 14px 'Orbitron',sans-serif;letter-spacing:2px;cursor:pointer;transition:all .3s;text-transform:uppercase}
.login-box .login-btn:hover{transform:translateY(-2px);box-shadow:0 4px 20px rgba(0,229,255,.2)}
.login-box .login-btn[disabled]{opacity:.4;cursor:default;transform:none}
.login-box .login-error{font-size:12px;color:var(--red);margin-top:8px;min-height:18px}

/* LAYOUT */
#appWrap{display:flex;width:100%;min-height:100vh;position:relative;z-index:1}
.sidebar{width:240px;min-width:240px;background:var(--bg2);border-right:1px solid var(--card-border);padding:16px 0;display:flex;flex-direction:column;height:100vh;position:sticky;top:0;overflow-y:auto}
.sidebar .sb-logo{padding:8px 20px 20px;border-bottom:1px solid var(--card-border);margin-bottom:8px}
.sidebar .sb-logo .play{font:900 20px 'Orbitron',sans-serif;color:var(--text)}
.sidebar .sb-logo .bits{font:900 20px 'Orbitron',sans-serif;color:var(--pink)}
.sidebar .sb-logo .sb-role{font-size:10px;color:var(--text3);letter-spacing:2px;text-transform:uppercase;margin-top:2px}
.sidebar .sb-user{font-size:12px;color:var(--text2);padding:8px 20px 12px;border-bottom:1px solid var(--card-border);margin-bottom:8px}
.sidebar .nav-item{display:flex;align-items:center;gap:12px;padding:12px 20px;color:var(--text2);font-size:13px;font-weight:600;cursor:pointer;transition:all .3s;border-left:3px solid transparent;letter-spacing:.5px}
.sidebar .nav-item:hover{color:var(--text);background:rgba(0,229,255,.03);border-left-color:var(--cyan)}
.sidebar .nav-item.active{color:var(--cyan);background:rgba(0,229,255,.06);border-left-color:var(--cyan)}
.sidebar .nav-item i{width:18px;font-size:14px;color:inherit}
.sidebar .nav-item.logout{margin-top:auto;color:var(--pink);border-left-color:transparent}
.sidebar .nav-item.logout:hover{background:rgba(255,45,149,.06);border-left-color:var(--pink)}
.main{flex:1;padding:20px 24px 40px;max-width:calc(100vw - 240px)}
.main .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.main .topbar h1{font:800 22px 'Orbitron',sans-serif;color:var(--cyan);letter-spacing:2px}
.main .topbar .refresh-btn{width:38px;height:38px;border-radius:var(--rs);border:1px solid var(--card-border);background:rgba(0,229,255,.06);color:var(--cyan);cursor:pointer;display:grid;place-items:center;font-size:15px;transition:all .3s}
.main .topbar .refresh-btn:hover{background:rgba(0,229,255,.12)}

/* STATS */
.stats-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:20px}
.stat-card{background:var(--card);border:1px solid var(--card-border);border-radius:var(--rs);padding:14px;text-align:center}
.stat-card .num{font:800 20px 'JetBrains Mono',monospace;color:var(--cyan);margin-bottom:2px}
.stat-card .lbl{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:1px}
.stat-card.gold .num{color:var(--gold)}
.stat-card.pink .num{color:var(--pink)}
.stat-card.green .num{color:var(--green)}

/* CARDS */
.card{background:var(--card);border:1px solid var(--card-border);border-radius:var(--r);padding:20px;margin-bottom:16px;overflow-x:auto}
.card-title{font:700 14px 'Orbitron',sans-serif;color:var(--text);letter-spacing:1px;text-transform:uppercase;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.card-title i{color:var(--cyan)}

/* TABLE */
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;padding:10px 8px;color:var(--text3);font-weight:700;text-transform:uppercase;letter-spacing:1px;font-size:10px;border-bottom:1px solid var(--card-border);position:sticky;top:0;background:var(--card);white-space:nowrap}
td{padding:8px;border-bottom:1px solid rgba(255,255,255,.03);color:var(--text2);vertical-align:middle}
tr:hover td{background:rgba(0,229,255,.02)}

/* TABS */
.tab-bar{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tab-btn{padding:8px 16px;border-radius:var(--rs);border:1px solid transparent;background:rgba(255,255,255,.03);color:var(--text2);cursor:pointer;font:700 12px 'Rajdhani',sans-serif;letter-spacing:1px;text-transform:uppercase;transition:all .3s}
.tab-btn:hover{color:var(--text);background:rgba(0,229,255,.04)}
.tab-btn.active{color:var(--cyan);background:rgba(0,229,255,.1);border-color:rgba(0,229,255,.2)}
.tab-content{display:none}.tab-content.active{display:block}

/* STATUS BADGES */
.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:10px;font-weight:700;letter-spacing:.5px}
.badge.green{background:rgba(0,255,136,.1);color:var(--green)}
.badge.gold{background:rgba(255,215,0,.1);color:var(--gold)}
.badge.cyan{background:rgba(0,229,255,.1);color:var(--cyan)}
.badge.red{background:rgba(255,51,85,.1);color:var(--red)}
.badge.gray{background:rgba(150,150,182,.1);color:var(--text3)}
.badge.purple{background:rgba(168,85,247,.1);color:var(--purple)}

/* SEARCH */
.search-bar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.search-bar input{flex:1;min-width:200px;padding:10px 14px;border-radius:var(--rs);border:1px solid var(--card-border);background:rgba(0,0,0,.3);color:var(--text);font:500 14px 'Rajdhani',sans-serif;outline:none}
.search-bar input:focus{border-color:var(--cyan)}
.search-bar button{padding:10px 18px;border-radius:var(--rs);border:none;background:rgba(0,229,255,.1);color:var(--cyan);cursor:pointer;font:700 12px 'Rajdhani',sans-serif;transition:all .3s}
.search-bar button:hover{background:rgba(0,229,255,.2)}
.search-bar select{padding:10px 14px;border-radius:var(--rs);border:1px solid var(--card-border);background:rgba(0,0,0,.3);color:var(--text);font:500 14px 'Rajdhani',sans-serif;outline:none}

/* PAGINATION */
.pagination{display:flex;justify-content:center;gap:6px;margin-top:12px;flex-wrap:wrap}
.pagination button{padding:6px 12px;border-radius:var(--rs);border:1px solid var(--card-border);background:rgba(0,0,0,.3);color:var(--text2);cursor:pointer;font:700 12px 'Rajdhani',sans-serif;transition:all .3s}
.pagination button:hover{color:var(--cyan);border-color:var(--cyan)}
.pagination button.active{color:var(--cyan);border-color:var(--cyan);background:rgba(0,229,255,.08)}
.pagination button:disabled{opacity:.3;cursor:default}

/* BUTTONS */
.btn-s{padding:4px 10px;border-radius:var(--rs);border:none;cursor:pointer;font:700 10px 'Rajdhani',sans-serif;text-transform:uppercase;letter-spacing:.5px;transition:all .3s;margin:1px}
.btn-green{background:rgba(0,255,136,.15);color:var(--green)}
.btn-green:hover{background:rgba(0,255,136,.25)}
.btn-red{background:rgba(255,51,85,.15);color:var(--red)}
.btn-red:hover{background:rgba(255,51,85,.25)}
.btn-cyan{background:rgba(0,229,255,.15);color:var(--cyan)}
.btn-cyan:hover{background:rgba(0,229,255,.25)}
.btn-gold{background:rgba(255,215,0,.15);color:var(--gold)}
.btn-gold:hover{background:rgba(255,215,0,.25)}
.mono{font-family:'JetBrains Mono',monospace;font-size:11px}
.truncate{max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block;vertical-align:middle}
.empty{padding:30px;text-align:center;color:var(--text3);font-size:13px}
.fade-in{animation:fi .3s ease}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:999;display:flex;justify-content:center;align-items:center;padding:20px;visibility:hidden;opacity:0;pointer-events:none;transition:opacity .3s}
.modal-overlay.open{visibility:visible;opacity:1;pointer-events:auto}
.modal-box{background:var(--bg2);border:2px solid var(--card-border);border-radius:var(--r);padding:24px;width:100%;max-width:500px;max-height:85vh;overflow-y:auto}
.modal-box .modal-close{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:50%;border:1px solid var(--card-border);background:rgba(255,255,255,.03);color:var(--text2);cursor:pointer;display:grid;place-items:center;font-size:14px}
.modal-box{position:relative}
.modal-box h2{font:800 16px 'Orbitron',sans-serif;color:var(--text);margin-bottom:16px;display:flex;align-items:center;gap:8px}
.modal-box .field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.modal-box .field label{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:1px;font-weight:700}
.modal-box .field input,.modal-box .field select{width:100%;padding:10px 14px;border-radius:var(--rs);border:1px solid var(--card-border);background:rgba(0,0,0,.3);color:var(--text);font:500 14px 'Rajdhani',sans-serif;outline:none}
.modal-box .field input:focus,.modal-box .field select:focus{border-color:var(--cyan)}
.modal-box .field .ro{font-size:13px;color:var(--text2);padding:6px 0}

/* RESPONSIVE */
@media(max-width:768px){.sidebar{width:56px;min-width:56px}.sidebar .sb-logo .play,.sidebar .sb-logo .bits,.sidebar .sb-logo .sb-role,.sidebar .sb-user,.sidebar .nav-item span{display:none}.sidebar .nav-item{padding:14px;justify-content:center}.sidebar .nav-item i{width:auto;font-size:18px}.sidebar .sb-logo{padding:8px 14px 14px}.main{max-width:calc(100vw - 56px);padding:14px 12px 30px}.stats-row{grid-template-columns:repeat(2,1fr)}.search-bar input{min-width:120px}}
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-box">
    <div class="lb-logo"><span class="play">PLAY</span><span class="bits">BITS</span></div>
    <div class="lb-sub">Admin Control Panel</div>
    <input type="email" id="loginUser" placeholder="Email" autocomplete="off" onkeydown="if(event.key==='Enter')login()">
    <input type="password" id="loginPass" placeholder="Password" onkeydown="if(event.key==='Enter')login()">
    <div class="login-error" id="loginError"></div>
    <button class="login-btn" id="loginBtn" onclick="login()"><i class="fa-solid fa-shield-halved"></i> Sign In</button>
  </div>
</div>

<div id="appWrap" style="display:none">
  <nav class="sidebar">
    <div class="sb-logo"><span class="play">PLAY</span><span class="bits">BITS</span><div class="sb-role" id="sbRole">ADMIN</div></div>
    <div class="sb-user" id="sbUser">Loading...</div>
    <div class="nav-item active" data-page="dashboard"><i class="fa-solid fa-gauge-high"></i><span>Dashboard</span></div>
    <div class="nav-item" data-page="users"><i class="fa-solid fa-users"></i><span>Users</span></div>
    <div class="nav-item" data-page="deposits"><i class="fa-solid fa-circle-dollar"></i><span>Deposits</span></div>
    <div class="nav-item" data-page="withdrawals"><i class="fa-solid fa-arrow-up-right-from-square"></i><span>Withdrawals</span></div>
    <div class="nav-item" data-page="income"><i class="fa-solid fa-chart-line"></i><span>Income Logs</span></div>
    <div class="nav-item" data-page="ranks"><i class="fa-solid fa-crown"></i><span>Ranks</span></div>
    <div class="nav-item" data-page="airdrop"><i class="fa-solid fa-gift"></i><span>Airdrop</span></div>
    <div class="nav-item" data-page="boosters"><i class="fa-solid fa-jet-fighter"></i><span>Boosters</span></div>
    <div class="nav-item" data-page="settings" id="navSettings" style="display:none"><i class="fa-solid fa-gear"></i><span>Settings</span></div>
    <div class="nav-item" data-page="admins" id="navAdmins" style="display:none"><i class="fa-solid fa-shield-halved"></i><span>Admins</span></div>
    <div class="nav-item logout" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i><span>Logout</span></div>
  </nav>
  <div class="main" id="mainContent"></div>
</div>

<script>
let TOKEN = localStorage.getItem("pb_admin_token") || "";
let ADMIN = null;
const API = "https://playbits-backend-132h.onrender.com";

function $(id){return document.getElementById(id)}

async function login(){
  const e=$("loginUser").value.trim(), p=$("loginPass").value;
  if(!e||!p)return;
  const btn=$("loginBtn");btn.disabled=true;btn.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i>';
  try{
    const r=await fetch(API+"/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:e,password:p})});
    const d=await r.json();
    if(!d.success){$("loginError").textContent=d.error||"Login failed";btn.disabled=false;btn.innerHTML='<i class="fa-solid fa-shield-halved"></i> Sign In';return}
    TOKEN=d.token;ADMIN=d.admin;
    localStorage.setItem("pb_admin_token",TOKEN);
    localStorage.setItem("pb_admin_user",JSON.stringify(d.admin));
    initApp();
  }catch(e){$("loginError").textContent="Backend unavailable";btn.disabled=false;btn.innerHTML='<i class="fa-solid fa-shield-halved"></i> Sign In'}
}

function logout(){
  localStorage.removeItem("pb_admin_token");localStorage.removeItem("pb_admin_user");
  TOKEN="";ADMIN=null;$("appWrap").style.display="none";$("loginScreen").style.display="flex";
  $("loginPass").value="";
}

function initApp(){
  ADMIN=JSON.parse(localStorage.getItem("pb_admin_user")||"{}");
  $("loginScreen").style.display="none";$("appWrap").style.display="flex";
  $("sbRole").textContent=ADMIN.role||"ADMIN";
  $("sbUser").textContent=ADMIN.email||ADMIN.username||"Admin";
  if(ADMIN.role==="SUPER_ADMIN"){$("navSettings").style.display="flex";$("navAdmins").style.display="flex"}
  document.querySelectorAll(".nav-item[data-page]").forEach(el=>{
    el.addEventListener("click",()=>{
      document.querySelectorAll(".nav-item").forEach(x=>x.classList.remove("active"));
      el.classList.add("active");loadPage(el.dataset.page);
    });
  });
  loadPage("dashboard");
}

function getHeaders(){return{"Authorization":"Bearer "+TOKEN,"Content-Type":"application/json"}}
async function api(path,opts={}){
  try{
    const r=await fetch(API+path,{...opts,headers:{...getHeaders(),...opts.headers}});
    const d=await r.json();
    if(!d.success&&r.status===401){logout();return null}
    return d;
  }catch(e){return null}
}

const PAGES={users:1,deposits:1,withdrawals:1,income:1,logs:1};
const PAGE_LIMIT=50;

function showToast(m){const e=document.createElement("div");e.style.cssText='position:fixed;bottom:40px;left:50%;transform:translateX(-50%);z-index:9999;background:rgba(0,0,0,.97);border:1px solid rgba(0,229,255,.15);padding:12px 24px;border-radius:24px;font-size:13px;font-weight:700;color:#fff;animation:fi .35s ease forwards;white-space:nowrap;max-width:90%;text-align:center';e.textContent=m;document.body.appendChild(e);setTimeout(()=>e.remove(),2500)}

function pagination(elId,pg,cb){
  const el=$(elId);if(!el||!pg||pg.totalPages<=1){if(el)el.innerHTML="";return}
  let h='<button '+(pg.page<=1?'disabled':'')+' onclick="cb('+(pg.page-1)+')"><i class="fa-solid fa-chevron-left"></i></button>';
  for(let i=Math.max(1,pg.page-2);i<=Math.min(pg.totalPages,pg.page+2);i++)
    h+='<button class="'+(i===pg.page?'active':'')+'" onclick="cb('+i+')">'+i+'</button>';
  h+='<button '+(pg.page>=pg.totalPages?'disabled':'')+' onclick="cb('+(pg.page+1)+')"><i class="fa-solid fa-chevron-right"></i></button>';
  el.innerHTML=h;
}

function loadPage(page){
  const m=$("mainContent");
  switch(page){
    case "dashboard": loadDashboard(); break;
    case "users": loadUsersPage(); break;
    case "deposits": loadDepositsPage(); break;
    case "withdrawals": loadWithdrawalsPage(); break;
    case "income": loadIncomePage(); break;
    case "ranks": loadRanksPage(); break;
    case "airdrop": loadAirdropPage(); break;
    case "boosters": loadBoostersPage(); break;
    case "settings": loadSettingsPage(); break;
    case "admins": loadAdminsPage(); break;
    default: m.innerHTML="<div class='empty'>Page not found</div>";
  }
}

// ========== DASHBOARD ==========
async function loadDashboard(){
  const m=$("mainContent");
  m.innerHTML='<div class="topbar"><h1><i class="fa-solid fa-gauge-high"></i> Dashboard</h1><button class="refresh-btn" onclick="loadDashboard()"><i class="fa-solid fa-rotate"></i></button></div><div class="stats-row" id="dashStats"><div class="stat-card"><div class="num">...</div><div class="lbl">Loading</div></div></div><div class="card fade-in" id="dashExtra"><div class="empty">Loading dashboard data...</div></div>';
  const d=await api("/api/admin/stats");
  if(!d||!d.success){$("dashStats").innerHTML='<div class="empty">Failed to load stats</div>';return}
  const s=d.stats;
  $("dashStats").innerHTML=
    '<div class="stat-card"><div class="num">'+s.totalUsers+'</div><div class="lbl">Total Users</div></div>'+
    '<div class="stat-card green"><div class="num">'+s.todayUsers+'</div><div class="lbl">Today Regs</div></div>'+
    '<div class="stat-card"><div class="num">'+s.totalDeposits+'</div><div class="lbl">Total Deposits</div></div>'+
    '<div class="stat-card gold"><div class="num">$'+Number(s.totalDepositAmount).toFixed(2)+'</div><div class="lbl">Deposited</div></div>'+
    '<div class="stat-card"><div class="num">'+s.totalWithdrawals+'</div><div class="lbl">Total WD</div></div>'+
    '<div class="stat-card pink"><div class="num">$'+Number(s.totalWithdrawalAmount).toFixed(2)+'</div><div class="lbl">Withdrawn</div></div>'+
    '<div class="stat-card"><div class="num">'+s.totalIncome+'</div><div class="lbl">Income Entries</div></div>'+
    '<div class="stat-card gold"><div class="num">$'+Number(s.totalIncomeAmount||0).toFixed(2)+'</div><div class="lbl">Income Total</div></div>'+
    '<div class="stat-card"><div class="num">'+s.totalPackages+'</div><div class="lbl">Packages</div></div>'+
    '<div class="stat-card gold"><div class="num">'+s.pendingWithdrawals+'</div><div class="lbl">Pending WD</div></div>'+
    '<div class="stat-card gold"><div class="num">'+s.pendingDeposits+'</div><div class="lbl">Pending Dep</div></div>';
  const r=await api("/api/admin/ranks-summary");
  let extraHtml='<div class="card fade-in" style="margin-bottom:12px"><div class="card-title"><i class="fa-solid fa-crown"></i> Rank Summary</div>'+
    '<div class="stats-row" style="grid-template-columns:repeat(4,1fr)">'+
    '<div class="stat-card"><div class="num">'+(r?.summary?.totalUsers||0)+'</div><div class="lbl">Total Users</div></div>'+
    '<div class="stat-card green"><div class="num">'+(r?.summary?.activatedUsers||0)+'</div><div class="lbl">Activated ($10+)</div></div>'+
    '<div class="stat-card"><div class="num">'+(r?.summary?.activePackage||0)+'</div><div class="lbl">Active Packages</div></div>'+
    '<div class="stat-card gold"><div class="num">$'+Number(r?.summary?.totalBusiness||0).toFixed(2)+'</div><div class="lbl">Total Business</div></div></div></div>';
  const bnbLow=s.masterBnbBalance!==undefined&&s.masterBnbBalance<s.gasThreshold;
  extraHtml+='<div class="card fade-in"><div class="card-title"><i class="fa-solid fa-gas-pump"></i> Master Wallet <span style="font-size:10px;letter-spacing:1px;color:var(--text3)">('+(s.masterAddress||'').slice(0,6)+'...'+(s.masterAddress||'').slice(-4)+')</span></div>'+
    '<div class="stats-row" style="grid-template-columns:repeat(3,1fr)">'+

async function editUser(id){
  const d=await api("/api/admin/users/"+id);
  if(!d||!d.success)return;
  const u=d.user;
  const fields=["firstName","username","depositBalance","activationUSDT","packageAmount","packageStatus","packageROI","packageCapMultiplier","packageMaxEarnings","packageEarned","bits","withdrawableBits","totalEarned","totalWithdrawn","freeBitsBalance","isActive"];
  const vals={};
  fields.forEach(f=>{vals[f]=u[f]!==undefined&&u[f]!==null?u[f]:""});
  let html='<div class="modal-overlay open" id="euModal" onclick="if(event.target===this)closeModal(\'euModal\')"><div class="modal-box">'+
    '<button class="modal-close" onclick="closeModal(\'euModal\')"><i class="fa-solid fa-xmark"></i></button>'+
    '<h2><i class="fa-solid fa-pen"></i> Edit User #'+id+'</h2>';
  fields.forEach(f=>{
    const type=f==="isActive"?"select":"text";
    html+='<div class="field"><label>'+f+'</label>';
    if(type==="select") html+='<select id="eu_'+f+'"><option value="true"'+(vals[f]?' selected':'')+'>Active</option><option value="false"'+(vals[f]?'':' selected')+'>Suspended</option></select>';
    else html+='<input type="text" id="eu_'+f+'" value="'+vals[f]+'">';
    html+='</div>'
  });
  html+='<button class="btn-s btn-green" style="padding:10px 20px;width:100%;font-size:13px" onclick="saveEditUser(\''+id+'\')"><i class="fa-solid fa-floppy-disk"></i> Save Changes</button></div></div>';
  document.body.insertAdjacentHTML("beforeend",html);
}

async function saveEditUser(id){
  const fields=["firstName","username","depositBalance","activationUSDT","packageAmount","packageStatus","packageROI","packageCapMultiplier","packageMaxEarnings","packageEarned","bits","withdrawableBits","totalEarned","totalWithdrawn","freeBitsBalance","isActive"];
  const updates={};
  fields.forEach(f=>{
    const el=$("eu_"+f);
    if(el){
      const val=f==="isActive"?el.value==="true":Number(el.value)||el.value;
      updates[f]=val;
    }
  });
  const r=await api("/api/admin/users/edit",{method:"POST",body:JSON.stringify({userId:id,updates})});
  if(r&&r.success){showToast("User updated");closeModal("euModal");loadUsersPage()}
  else showToast("Error: "+(r?.error||"unknown"));
}

async function toggleSuspend(id,currentActive){
  const r=await api("/api/admin/users/suspend",{method:"POST",body:JSON.stringify({userId:id,suspend:currentActive})});
  if(r&&r.success){showToast(currentActive?"User suspended":"User activated");loadUsersPage()}

}

      sources.forEach(src=>{
        const cur=rr.rewards[src]||"";
        rhtml+='<div style="background:var(--bg3);border-radius:var(--rs);padding:12px"><div style="font-size:11px;color:var(--text3);margin-bottom:4px">'+src+'</div><div style="display:flex;gap:6px"><input type="number" id="rwd_'+src+'" value="'+cur+'" style="flex:1;padding:6px 10px;border-radius:4px;border:1px solid var(--card-border);background:rgba(0,0,0,.3);color:var(--text);font-size:12px;outline:none"><button class="btn-s btn-green" onclick="updateReward(\''+src+'\')"><i class="fa-solid fa-floppy-disk"></i></button></div></div>'
      });
      rhtml+='</div>';
      $("rewardSettings").innerHTML=rhtml;
    }
    return;
  }
  $("mainContent").innerHTML=html;
}

async function updateReward(source){
  const el=$("rwd_"+source);if(!el)return;
  const bits=parseInt(el.value);
  if(bits<0){showToast("Invalid value");return}
  const r=await api("/api/admin/airdrop/update-reward",{method:"POST",body:JSON.stringify({source,bits})});
  if(r&&r.success){showToast("Updated "+source+" = "+bits);loadAirdropPage()}
  else showToast("Error: "+(r?.error||"unknown"));
}

// ========== BOOSTERS ==========
async function loadBoostersPage(){
  const m=$("mainContent");
  m.innerHTML='<div class="topbar"><h1><i class="fa-solid fa-jet-fighter"></i> Boosters</h1><button class="refresh-btn" onclick="loadBoostersPage()"><i class="fa-solid fa-rotate"></i></button></div><div class="card fade-in"><div class="empty">Loading...</div></div>';
  const d=await api("/api/admin/booster-summary");
  if(!d||!d.success)return;
  const s=d.summary;
  let html='<div class="card fade-in"><div class="card-title"><i class="fa-solid fa-chart-bar"></i> Booster Distribution</div><table><thead><tr><th>Booster</th><th>Status</th><th>Count</th></tr></thead><tbody>';
  if(s.groups&&s.groups.length)
    s.groups.forEach(g=>{html+='<tr><td>'+(g.boosterName||g.boosterLevelId||'-')+'</td><td><span class="badge '+(g.boosterStatus==="active"?"green":"gray")+'">'+(g.boosterStatus||'-')+'</span></td><td>'+g.c+'</td></tr>'});
  else html+='<tr><td colspan="3" class="empty">No boosters</td></tr>';
  html+='</tbody></table></div><div class="card fade-in"><div class="card-title"><i class="fa-solid fa-users"></i> Active Boosters</div><table><thead><tr><th>ID</th><th>Name</th><th>Booster</th><th>Extra ROI</th><th>Activated</th><th>Expires</th></tr></thead><tbody>';
  if(s.active&&s.active.length)
    s.active.forEach(u=>{html+='<tr><td class="mono">'+u.telegramId+'</td><td>'+(u.firstName||'-')+'</td><td>'+(u.boosterName||'-')+'</td><td>+'+(u.boosterExtraROI||0)+'%</td><td class="mono">'+(u.boosterActivatedAt?new Date(u.boosterActivatedAt).toLocaleDateString():'-')+'</td><td class="mono">'+(u.boosterExpiresAt?new Date(u.boosterExpiresAt).toLocaleDateString():'-')+'</td></tr>'});
  else html+='<tr><td colspan="6" class="empty">No active boosters</td></tr>';
  html+='</tbody></table></div>';
  $("mainContent").innerHTML='<div class="topbar"><h1><i class="fa-solid fa-jet-fighter"></i> Boosters</h1><button class="refresh-btn" onclick="loadBoostersPage()"><i class="fa-solid fa-rotate"></i></button></div>'+html;
}

// ========== SETTINGS ==========
async function loadSettingsPage(){
  if(ADMIN.role!=="SUPER_ADMIN"){$("mainContent").innerHTML='<div class="empty">Access denied</div>';return}
  const m=$("mainContent");
  m.innerHTML='<div class="topbar"><h1><i class="fa-solid fa-gear"></i> Settings</h1><button class="refresh-btn" onclick="loadSettingsPage()"><i class="fa-solid fa-rotate"></i></button></div><div class="card fade-in"><div class="empty">Loading...</div></div>';
  const d=await api("/api/admin/settings");
  if(!d||!d.success)return;
  const s=d.settings;
  const keys=["maintenance_mode","announcement_banner","min_withdrawal","max_withdrawal","company_wallet"];
  let html='<div class="card-title"><i class="fa-solid fa-sliders"></i> System Settings</div><div style="display:grid;gap:10px;max-width:500px">';
  keys.forEach(k=>{
    const val=s[k]||"";
    html+='<div class="field"><label>'+(k.replace(/_/g," ").toUpperCase())+'</label><div style="display:flex;gap:6px"><input type="text" id="set_'+k+'" value="'+val+'" style="flex:1;padding:8px 12px;border-radius:4px;border:1px solid var(--card-border);background:rgba(0,0,0,.3);color:var(--text);font-size:13px;outline:none"><button class="btn-s btn-green" onclick="saveSetting(\''+k+'\')"><i class="fa-solid fa-floppy-disk"></i></button></div></div>'
  });
  html+='</div>';
  $("mainContent").innerHTML='<div class="topbar"><h1><i class="fa-solid fa-gear"></i> Settings</h1><button class="refresh-btn" onclick="loadSettingsPage()"><i class="fa-solid fa-rotate"></i></button></div><div class="card fade-in">'+html+'</div>';
}

async function saveSetting(key){
  const el=$("set_"+key);if(!el)return;
  const r=await api("/api/admin/settings",{method:"POST",body:JSON.stringify({key,value:el.value})});
  if(r&&r.success){showToast("Saved: "+key)}else showToast("Error: "+(r?.error||"unknown"))
}

// ========== ADMINS ==========
async function loadAdminsPage(){
  if(ADMIN.role!=="SUPER_ADMIN")return;
  const m=$("mainContent");
  m.innerHTML='<div class="topbar"><h1><i class="fa-solid fa-shield-halved"></i> Admins</h1><button class="refresh-btn" onclick="loadAdminsPage()"><i class="fa-solid fa-rotate"></i></button></div><div class="card fade-in"><div class="empty">Loading...</div></div>';
  const d=await api("/api/admin/admins");
  if(!d||!d.success)return;
  let html='<div style="display:flex;justify-content:flex-end;margin-bottom:12px"><button class="btn-s btn-green" style="padding:8px 16px;font-size:12px" onclick="showCreateAdmin()"><i class="fa-solid fa-plus"></i> New Admin</button></div>'+
    '<table><thead><tr><th>Email</th><th>Username</th><th>Role</th><th>Active</th><th>Created</th><th>Last Login</th><th>Action</th></tr></thead><tbody>';
  d.admins.forEach(a=>{
    html+='<tr><td>'+(a.email||'-')+'</td><td>'+(a.username||'-')+'</td><td><span class="badge '+(a.role==="SUPER_ADMIN"?"red":a.role==="ADMIN"?"green":"gray")+'">'+(a.role||'-')+'</span></td><td>'+(a.isActive?'<span class="badge green">Active</span>':'<span class="badge red">Suspended</span>')+'</td><td class="mono">'+(a.createdAt?new Date(a.createdAt).toLocaleDateString():'-')+'</td><td class="mono">'+(a.lastLogin?new Date(a.lastLogin).toLocaleDateString():'Never')+'</td><td><button class="btn-s btn-'+(a.isActive?'red':'green')+'" onclick="toggleAdmin(\''+a.id+'\')">'+(a.isActive?'Suspend':'Activate')+'</button></td></tr>'
  });
  html+='</tbody></table>';
  const logs=await api("/api/admin/logs?limit=20");
  if(logs&&logs.success){
    html+='<div style="margin-top:20px"><div class="card-title"><i class="fa-solid fa-clock-rotate-left"></i> Recent Audit Logs</div><table><thead><tr><th>Admin</th><th>Action</th><th>Target</th><th>Details</th><th>Date</th></tr></thead><tbody>';
    (logs.logs||[]).forEach(l=>{
      html+='<tr><td>'+(l.adminUsername||'-')+'</td><td><span class="badge cyan">'+(l.action||'-')+'</span></td><td>'+(l.targetType||'-')+' #'+(l.targetId||'').slice(0,10)+'</td><td class="truncate" style="max-width:200px">'+(l.details||'-')+'</td><td class="mono">'+(l.createdAt?new Date(l.createdAt).toLocaleString():'-')+'</td></tr>'
    });
    html+='</tbody></table></div>'
  }
  $("mainContent").innerHTML='<div class="topbar"><h1><i class="fa-solid fa-shield-halved"></i> Admins</h1><button class="refresh-btn" onclick="loadAdminsPage()"><i class="fa-solid fa-rotate"></i></button></div><div class="card fade-in">'+html+'</div>';
}

function showCreateAdmin(){
  const html='<div class="modal-overlay open" id="caModal" onclick="if(event.target===this)closeModal(\'caModal\')"><div class="modal-box">'+
    '<button class="modal-close" onclick="closeModal(\'caModal\')"><i class="fa-solid fa-xmark"></i></button>'+
    '<h2><i class="fa-solid fa-user-shield"></i> Create Admin</h2>'+
    '<div class="field"><label>Email *</label><input type="email" id="caEmail" placeholder="admin@example.com"></div>'+
    '<div class="field"><label>Username (optional)</label><input type="text" id="caUser" placeholder="Display name"></div>'+
    '<div class="field"><label>Password (min 6 chars)</label><input type="password" id="caPass" placeholder="Password"></div>'+
    '<div class="field"><label>Role</label><select id="caRole"><option value="ADMIN">Admin</option><option value="MODERATOR">Moderator</option><option value="SUPER_ADMIN">Super Admin</option></select></div>'+
    '<button class="btn-s btn-green" style="padding:10px 20px;width:100%;font-size:13px" onclick="createAdmin()"><i class="fa-solid fa-plus"></i> Create</button></div></div>';
  document.body.insertAdjacentHTML("beforeend",html);
}

async function createAdmin(){
  const em=$("caEmail")?.value.trim(),u=$("caUser")?.value.trim(),p=$("caPass")?.value,r=$("caRole")?.value;
  if(!em||!p||p.length<6){showToast("Valid email & password (6+ chars) required");return}
  const d=await api("/api/admin/admins/create",{method:"POST",body:JSON.stringify({email:em,username:u,password:p,role:r})});
  if(d&&d.success){showToast("Admin created");closeModal("caModal");loadAdminsPage()}
  else showToast("Error: "+(d?.error||"unknown"))
}

async function toggleAdmin(id){
  const d=await api("/api/admin/admins/toggle",{method:"POST",body:JSON.stringify({id})});
  if(d&&d.success){showToast("Updated");loadAdminsPage()}else showToast("Error")
}

function closeModal(id){const el=$(id);if(el)el.remove()}

// INIT ON LOAD
(function(){
  const saved=localStorage.getItem("pb_admin_user");
  const token=localStorage.getItem("pb_admin_token");
  if(saved&&token){TOKEN=token;initApp()}else{$("loginScreen").style.display="flex"}
})()
</script>
</body>
</html>
